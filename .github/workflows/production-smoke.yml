name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run production API and frontend smoke tests
        env:
          HAMNAVAZ_BASE_URL: https://hamnavaz.vercel.app
        run: bash scripts/production-smoke.sh
