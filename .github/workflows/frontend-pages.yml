name: Frontend Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend-next/**'
      - '.github/workflows/frontend-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - name: Checkout clean workspace
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies from scratch
        run: npm install --no-audit --no-fund

      - name: Build frontend from scratch
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          rm -rf .next out
          npm run build

      - name: Verify fresh static output
        run: |
          test -d out
          test -f out/index.html
          test -d out/_next
          echo "Fresh static output verified from frontend-next"
          find out/_next -maxdepth 2 -type f | head -20

      - name: Upload fresh Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-next/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy fresh Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
