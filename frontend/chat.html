
<!DOCTYPE html>
<html>

<head>

<title>Hamnavaz Chat</title>

<link rel="stylesheet" href="style.css">

<style>

.chat-box{
    height:400px;
    overflow-y:auto;
    padding:10px;
}

.msg{
    padding:10px;
    margin:8px;
    border-radius:12px;
    max-width:70%;
}

.mine{
    background:#d1ffd6;
    margin-left:auto;
    text-align:right;
}

.other{
    background:#eeeeee;
    margin-right:auto;
}

input{
    width:80%;
}

</style>

</head>


<body>


<div class="container">


<h2>
Hamnavaz Chat
</h2>


<p id="receiverText"></p>


<div id="messages" class="chat-box">
Loading...
</div>


<input
id="text"
placeholder="Write message">


<button onclick="sendMessage()">
Send
</button>


</div>


<script>


const API = window.location.origin;


const token = localStorage.getItem("token");
const params =
new URLSearchParams(window.location.search);


const receiver =
params.get("receiver");


document.getElementById("receiverText").innerHTML =
"Chat with musician ID: " + receiver;



async function loadMessages(){


const response = await fetch(
`${API}/messages/`,
{
headers:{
"Authorization": "Bearer " + token
}
}
);

const data =
await response.json();



let html="";


data.forEach(msg=>{


if(msg.sender_id==1){


html += `

<div class="msg mine">
${msg.text}
</div>

`;

}

else{


html += `

<div class="msg other">
${msg.text}
</div>

`;

}


});



document.getElementById("messages").innerHTML =
html;


const box =
document.getElementById("messages");


box.scrollTop =
box.scrollHeight;


}




async function sendMessage(){


const text =
document.getElementById("text").value;


if(!text)
return;

await fetch(
`${API}/messages/`,
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer " + token
},
body:JSON.stringify({
receiver_id: Number(receiver),
text:text
})
}
);

document.getElementById("text").value="";


loadMessages();


}



loadMessages();


setInterval(
loadMessages,
3000
);


</script>


</body>

</html>
