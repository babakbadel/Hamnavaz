<!DOCTYPE html>
<html>
<head>
    <title>Collaboration Requests</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h2>Collaboration Requests</h2>

<div id="requests">
Loading...
</div>

</div>


<script>

const API = window.location.origin;


async function loadRequests(){

    const token = localStorage.getItem("token");

    if(!token){
        alert("Please login first");
        window.location.href="login.html";
        return;
    }


    const response = await fetch(
        `${API}/collaboration-request/inbox`,
        {
            headers:{
                "Authorization": `Bearer ${token}`
            }
        }
    );


    const data = await response.json();

    const box = document.getElementById("requests");


    if(data.length === 0){

        box.innerHTML = `
        <p>No requests found</p>
        `;

        return;
    }


    box.innerHTML = "";


    data.forEach(req => {

        box.innerHTML += `

        <div class="card">

            <p>
            Request ID:
            ${req.id}
            </p>

            <p>
            From musician:
            ${req.from_musician_id}
            </p>

            <p>
            Message:
            ${req.message}
            </p>

            <p>
            Status:
            ${req.status}
            </p>


            ${
            req.status === "pending"
            ?
            `
            <button onclick="acceptRequest(${req.id})">
            Accept
            </button>

            <button onclick="rejectRequest(${req.id})">
            Reject
            </button>
<button onclick="openChat(${req.from_musician_id})">
Chat
</button>

            `
            :
            ""
            }

        </div>

        `;

    });

}



async function acceptRequest(id){

    const token = localStorage.getItem("token");


    const response = await fetch(
        `${API}/collaboration-request/${id}/accept`,
        {
            method:"PUT",
            headers:{
                "Authorization": `Bearer ${token}`
            }
        }
    );


    const data = await response.json();

    alert(data.message);

    loadRequests();

}


async function acceptRequest(id){

    const token = localStorage.getItem("token");

    const response = await fetch(
        `${API}/collaboration-request/${id}/accept`,
        {
            method:"PUT",
            headers:{
                "Authorization":`Bearer ${token}`
            }
        }
    );


    const data = await response.json();

    alert(data.message);

    loadRequests();

}



async function rejectRequest(id){

    const token = localStorage.getItem("token");


    const response = await fetch(
        `${API}/collaboration-request/${id}/reject`,
        {
            method:"PUT",
            headers:{
                "Authorization":`Bearer ${token}`
            }
        }
    );


    const data = await response.json();

    alert(data.message);

    loadRequests();

}


function openChat(id){

    window.location.href =
    `chat.html?receiver=${id}`;

}

loadRequests();

</script>

</body>
</html>
